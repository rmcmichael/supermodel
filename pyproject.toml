[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supermodel"
version = "0.1.0"
description = "A lightweight, class-based interface for persisting objects in SQLite."
readme = "readme.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supermodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
